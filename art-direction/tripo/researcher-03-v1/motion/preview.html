<canvas aria-label="03 号研究员从广场走到 Agent 中心台阶前"></canvas>
<footer><span>DEMO · 03 号研究员</span><button type="button" disabled>加载中</button></footer>
<script type="module">
  import { createReview } from './preview.mjs';
  const button = document.querySelector('button');
  try {
    const review = await createReview(document.querySelector('canvas'));
    const preference = matchMedia('(prefers-reduced-motion: reduce)');
    let running = !preference.matches;
    let time = 0;
    let last = null;
    function draw() {
      review.render(time);
      button.textContent = running ? '暂停' : time >= review.duration ? '重播' : '播放';
    }
    function tick(now) {
      if (running && !document.hidden) {
        if (last !== null) time = Math.min(review.duration, time + (now-last)/1000);
        if (time >= review.duration) running = false;
        draw();
      }
      last = now;
      requestAnimationFrame(tick);
    }
    document.addEventListener('visibilitychange', () => { last = null; });
    preference.addEventListener('change', () => {
      if (preference.matches) { running = false; draw(); }
    });
    button.addEventListener('click', () => {
      if (time >= review.duration) time = 0;
      running = !running;
      last = null;
      draw();
    });
    addEventListener('resize', draw);
    button.disabled = false;
    draw();
    requestAnimationFrame(tick);
  } catch (error) {
    document.querySelector('footer span').textContent = '预览加载失败，请检查本地服务和 WebGL。';
    console.error(error);
  }
</script>
</html>
